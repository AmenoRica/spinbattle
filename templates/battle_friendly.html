{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "대전" %} - SpinBattle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spin-disc {
            --spin-duration: 1s;
            border-radius: 50%;
            overflow: hidden;
            animation: spin var(--spin-duration) linear infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .spin-disc::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .spin-disc img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-disc.stopped {
            animation-play-state: paused;
            animation: wobbleStop 1.2s ease-out forwards;
        }
        @keyframes wobbleStop {
            0% { transform: rotate(0deg); filter: none; }
            15% { transform: rotate(8deg) scale(0.97); }
            30% { transform: rotate(-6deg) scale(0.95); }
            45% { transform: rotate(4deg) scale(0.93); }
            60% { transform: rotate(-2deg) scale(0.91); }
            75% { transform: rotate(1deg) scale(0.90); filter: grayscale(0.5); }
            100% { transform: rotate(0deg) scale(0.88); filter: grayscale(1) brightness(0.5); }
        }

        .spin-accel-glow {
            animation: accelGlow 0.5s ease-out !important;
        }
        @keyframes accelGlow {
            0% { box-shadow: 0 0 40px 20px rgba(251, 191, 36, 0.7), 0 4px 15px rgba(0,0,0,0.5); }
            100% { box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        }

        .spin-attack-lunge {
            animation: attackLunge 0.35s ease-out !important;
        }
        @keyframes attackLunge {
            0% { transform: rotate(0deg) translateX(0); }
            40% { transform: rotate(180deg) translateX(50px); }
            100% { transform: rotate(360deg) translateX(0); }
        }

        .spin-hit-wobble {
            animation: hitWobble 0.4s ease-out !important;
        }
        @keyframes hitWobble {
            0% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(15deg) scale(0.94); }
            30% { transform: rotate(-10deg) scale(0.96); }
            50% { transform: rotate(6deg) scale(0.98); }
            70% { transform: rotate(-3deg) scale(0.99); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .spin-crit-hit {
            animation: critHit 0.5s ease-out !important;
        }
        @keyframes critHit {
            0% { transform: rotate(0deg) scale(1); filter: brightness(1); }
            10% { transform: rotate(20deg) scale(0.88); filter: brightness(1.8); }
            25% { transform: rotate(-15deg) scale(0.92); filter: brightness(1.4); }
            40% { transform: rotate(10deg) scale(0.95); }
            60% { transform: rotate(-5deg) scale(0.97); }
            80% { transform: rotate(2deg) scale(0.99); }
            100% { transform: rotate(0deg) scale(1); filter: brightness(1); }
        }

        .spin-endure-aura {
            animation: endureAura 0.8s ease-out;
        }
        @keyframes endureAura {
            0% { box-shadow: 0 0 50px 25px rgba(253, 230, 138, 0.8), 0 0 0 5px rgba(253, 230, 138, 0.5); }
            100% { box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        }

        .spin-winner {
            animation: winnerPulse 1.5s ease-in-out infinite !important;
            filter: none !important;
        }
        @keyframes winnerPulse {
            0%, 100% { box-shadow: 0 0 30px 12px rgba(251, 191, 36, 0.4), 0 4px 15px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 50px 25px rgba(251, 191, 36, 0.8), 0 4px 15px rgba(0,0,0,0.5); }
        }

        .battle-float-text {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: bold;
            font-size: 22px;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-25px) scale(1.2); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-55px) scale(0.9); }
        }

        .battle-spark {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkFly 0.4s ease-out forwards;
        }
        @keyframes sparkFly {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
        }

        .battle-slash {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 5px;
            pointer-events: none;
            z-index: 100;
        }
        .battle-slash::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ef4444;
            transform-origin: left center;
            animation: slashSwipe 0.3s ease-out;
        }
        @keyframes slashSwipe {
            0% { opacity: 1; transform: scaleX(0) rotate(-30deg); }
            50% { opacity: 1; transform: scaleX(1.5) rotate(-30deg); }
            100% { opacity: 0; transform: scaleX(2) rotate(-30deg); }
        }
        .battle-slash-crit::before {
            width: 100%;
            height: 8px;
            background: #f97316;
            box-shadow: 0 0 20px #f97316;
        }

        .battle-log-line {
            margin: 0;
            padding: 1px 0;
            line-height: 1.4;
        }

        #battle-log {
            scrollbar-width: thin;
            scrollbar-color: #4b5563 #1f2937;
        }
        #battle-log::-webkit-scrollbar { width: 6px; }
        #battle-log::-webkit-scrollbar-track { background: #1f2937; }
        #battle-log::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }

        .speed-track {
            background: radial-gradient(ellipse at center, #374151 0%, #1f2937 100%);
            border-radius: 9999px;
        }

        @keyframes countdownPulse {
            0% { transform: scale(0.3); opacity: 0; }
            30% { transform: scale(1.3); opacity: 1; }
            70% { transform: scale(1.0); opacity: 1; }
            100% { transform: scale(1.0); opacity: 0; }
        }
        .animate-countdown-pulse {
            animation: countdownPulse 0.9s ease-out forwards;
        }

        .spin-container {
            width: 350px;
            height: 350px;
        }

        @media (max-width: 768px) {
            .spin-container {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden flex flex-col">
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex-shrink-0">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="{% url 'home' %}" class="text-xl font-bold text-indigo-400 hover:text-indigo-300">SpinBattle</a>
            <div class="flex items-center gap-3">
                <span id="battle-mode-label" class="text-gray-400 text-sm">{% trans "대전" %}</span>
                <button id="btn-sound" class="px-2 py-1 text-sm rounded hover:bg-gray-700 transition">🔇</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col max-w-4xl mx-auto w-full overflow-hidden">
        <div class="flex items-center justify-center gap-6 sm:gap-12 py-4 px-4 flex-shrink-0">
            <div class="text-center">
                <div class="relative inline-block spin-container">
                    <div id="spin-a" class="spin-disc w-full h-full border-4 border-gray-500" data-init-speed="50" data-max-speed="100" style="--spin-duration:0.8s">
                        <img id="spin-a-img" src="" alt="">
                    </div>
                </div>
                <p id="spin-a-name" class="text-sm font-bold mt-3 truncate max-w-[350px] mx-auto"></p>
                <p id="spin-a-type" class="text-xs font-bold mt-1"></p>
                <p id="spin-a-score" class="text-xs mt-1 hidden"></p>
                <div class="w-24 mx-auto mt-2">
                    <div class="speed-track h-2.5 overflow-hidden">
                        <div id="speed-bar-a" class="h-full rounded-full transition-all duration-300 bg-indigo-400" style="width:100%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1"><span id="speed-val-a">0</span></p>
                </div>
            </div>

            <div class="text-3xl font-black text-gray-600 select-none">VS</div>

            <div class="text-center">
                <div class="relative inline-block spin-container">
                    <div id="spin-b" class="spin-disc w-full h-full border-4 border-gray-500" data-init-speed="50" data-max-speed="100" style="--spin-duration:0.8s">
                        <img id="spin-b-img" src="" alt="">
                    </div>
                </div>
                <p id="spin-b-name" class="text-sm font-bold mt-3 truncate max-w-[350px] mx-auto"></p>
                <p id="spin-b-type" class="text-xs font-bold mt-1"></p>
                <p id="spin-b-score" class="text-xs mt-1 hidden"></p>
                <div class="w-24 mx-auto mt-2">
                    <div class="speed-track h-2.5 overflow-hidden">
                        <div id="speed-bar-b" class="h-full rounded-full transition-all duration-300 bg-indigo-400" style="width:100%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1"><span id="speed-val-b">0</span></p>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-hidden bg-gray-800 rounded-t-lg mx-4 flex flex-col min-h-0">
            <div id="countdown-overlay" class="fixed inset-0 z-40 flex items-center justify-center pointer-events-none hidden">
            <span id="countdown-text" class="text-8xl font-black text-white drop-shadow-[0_0_30px_rgba(129,140,248,0.8)] animate-countdown-pulse"></span>
        </div>

        <div id="battle-log" class="flex-1 overflow-y-auto font-mono text-sm text-gray-300 p-4 min-h-0">
            </div>
        </div>

        <div class="bg-gray-800 border-t border-gray-700 rounded-b-lg mx-4 mb-4 px-4 py-3 flex-shrink-0">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center gap-2">
                    <button id="btn-restart" class="px-2 py-1 text-sm bg-gray-700 text-gray-300 rounded hover:bg-gray-600 transition">◀◀</button>
                    <button id="btn-play" class="px-3 py-1 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-500 transition font-bold">▶</button>
                    <button id="btn-skip" class="px-2 py-1 text-sm bg-gray-700 text-gray-300 rounded hover:bg-gray-600 transition">▶▶</button>
                </div>
                <div class="flex items-center gap-1">
                    <button class="btn-speed px-2 py-1 text-xs rounded bg-gray-700 text-gray-400 transition" data-speed="0.5">0.5x</button>
                    <button class="btn-speed px-2 py-1 text-xs rounded bg-indigo-600 text-white transition" data-speed="1">1x</button>
                    <button class="btn-speed px-2 py-1 text-xs rounded bg-gray-700 text-gray-400 transition" data-speed="2">2x</button>
                    <button class="btn-speed px-2 py-1 text-xs rounded bg-gray-700 text-gray-400 transition" data-speed="3">3x</button>
                </div>
            </div>
            <div id="end-controls" class="hidden flex items-center justify-center gap-4 mt-3 pt-3 border-t border-gray-700">
                <button onclick="BattleReplay.restart()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded transition text-sm">{% trans "다시 보기" %}</button>
                <a href="/" onclick="history.back(); return false;" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-300 rounded transition text-sm">{% trans "돌아가기" %}</a>
            </div>
        </div>
    </main>

    <script>
    window.BattleI18n = {
        noBattleData: "{% trans '전투 데이터가 없습니다.' %}",
        rankedBattle: "{% trans '랭크 대전' %}",
        friendlyBattle: "{% trans '친선 대전' %}",
        pts: "{% trans '점' %}",
        accel: "{% trans '가속!' %}",
        endure: "{% trans '인내!' %}",
        countdownGo: "{% trans '시작!' %}"
    };
    </script>
    <script src="{% static 'js/battle-sound.js' %}?v=5"></script>
    <script src="{% static 'js/battle-effects.js' %}?v=5"></script>
    <script src="{% static 'js/battle.js' %}?v=5"></script>
</body>
</html>
