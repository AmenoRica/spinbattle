{% extends "base.html" %}
{% load i18n %}

{% block title %}SpinBattle{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-16 text-center">
    <h1 class="text-5xl font-extrabold text-indigo-400 mb-4">SpinBattle</h1>
    <p class="text-xl text-gray-400 mb-8">{% trans "나만의 이미지를 팽이로 만들어 싸워보세요" %}</p>
    {% if user.is_authenticated %}
        <a href="{% url 'my_spins' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-lg text-lg transition">{% trans "내 팽이" %}</a>
    {% else %}
        <a href="{% url 'signup' %}" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-lg text-lg transition">{% trans "시작하기" %}</a>
    {% endif %}
</div>
{% endblock %}
